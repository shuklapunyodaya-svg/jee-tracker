<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEE 2028 Tracker</title>
<meta name="theme-color" content="#4a33c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2fc;--card:#fff;--tx:#161430;--mut:#6b6886;--bd:#e5e2f4;--hm:#ebe9f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0b19;--card:#161428;--tx:#eceaff;--mut:#9894b8;--bd:#2a2746;--hm:#242140;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0b19;--card:#161428;--tx:#eceaff;--mut:#9894b8;--bd:#2a2746;--hm:#242140;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:15px/1.45 Outfit,system-ui,sans-serif;background:radial-gradient(800px 420px at 90% -8%,rgba(124,92,255,.2),transparent 60%),radial-gradient(600px 380px at -10% 8%,rgba(34,201,151,.13),transparent 60%),var(--bg)}
main{max-width:1040px;margin:0 auto;padding:14px 14px 70px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #8a6bff;outline-offset:2px}
.hero{position:relative;display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;justify-content:space-between;padding:22px;border-radius:30px;color:#fff;background:linear-gradient(135deg,#231a62,#4a33c7 55%,#8b5dff);margin-bottom:16px}
.hl{display:flex;gap:18px;align-items:center}
.hero h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
.hero p{margin:4px 0 0;opacity:.8}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800}
.hr{flex:1;min-width:240px;max-width:380px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.17);border-radius:999px;padding:6px 14px;font-size:14px}
.chip b{font-weight:800}
.goal{margin-top:14px;font-size:14px}
.goal .bar{background:rgba(255,255,255,.22);margin:6px 0 0}.goal .bar i{background:#fff}
.hero .ld{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.th{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.17);color:#fff}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
nav button{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:600}
nav button.on{background:var(--ac,#7c5cff);border-color:transparent;color:#fff}
nav small{opacity:.75;font-weight:400}
nav .sp{flex:1}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 12px;font-size:19px;font-weight:600}
.sh{border-top:5px solid var(--ac)}
.shl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.shl h2{margin:0;font-size:26px;font-weight:800}
.big{font-size:26px!important}
.bar{height:8px;border-radius:9px;background:var(--hm);overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.chip2{border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--mut)}
.chip2 b{color:var(--tx)}
.fcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.fc{border:1px solid var(--bd);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;color:var(--mut)}
.fc.on{background:var(--ac);border-color:transparent;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:14px 14px 12px 20px;box-shadow:inset 6px 0 0 var(--ac)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.hd h3{margin:0;font-size:18px;font-weight:600}
.pc{font-weight:800;color:var(--ac)}
.n{flex:1;min-width:0;font:inherit;font-weight:600;background:transparent;color:var(--tx);border:1px dashed var(--bd);border-radius:8px;padding:3px 6px}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.cl{width:26px;height:26px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);font-size:11px;font-weight:600;color:var(--mut);padding:0}
.cl.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ft{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:14px;color:var(--mut)}
.ld{width:54px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:2px 6px;margin:0 4px}
.nx{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;border-radius:999px;padding:6px 14px;background:var(--ac);color:#fff;font-weight:600}
.dn{color:var(--ac);font-weight:600}
.fl{display:flex;gap:8px}
.pill{flex:1;border:1px solid var(--bd);background:var(--bg);border-radius:12px;padding:8px 6px;font-weight:600;color:var(--mut)}
.pill.on{background:var(--ac);border-color:transparent;color:#fff}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0;font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:9px 12px}
.add button,.lk{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:600}
.lk{border:0;background:none;color:var(--mut);padding:8px 0 0;font-weight:400;text-decoration:underline}
.lw{max-height:240px;overflow:auto;margin-top:6px}
.lr{display:flex;align-items:center;gap:6px;border-top:1px solid var(--bd)}
.lb{flex:1;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;padding:7px 2px;color:var(--mut)}
.lr.ok .lb{color:var(--tx)}.lr.ok .t{text-decoration:line-through;opacity:.6}
.bx{width:20px;height:20px;border-radius:7px;border:2px solid var(--bd);display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.lr.ok .bx{background:var(--ac);border-color:var(--ac)}
.ln{flex:1;min-width:0;font:inherit;background:transparent;color:var(--tx);border:1px dashed var(--bd);border-radius:8px;padding:3px 6px;margin:3px 0}
.del,.mv{border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:2px 9px}
.del{color:#e5484d}
.row{display:grid;grid-template-columns:104px 1fr 44px;gap:10px;align-items:center;margin:9px 0}
.row .bar{margin:0;height:10px}.row b{text-align:right}
.sub{color:var(--mut);font-size:13px;margin:-4px 0 0 114px}
.nxr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.nxr>div{flex:1;min-width:0}.nxr small{display:block;color:var(--mut)}
.nxr b{color:var(--ac)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:100px;background:var(--bg);border-radius:16px;padding:10px 14px}
.stat b{display:block;font-size:26px;font-weight:800}.stat span{color:var(--mut);font-size:13px}
.hm{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.hm div{aspect-ratio:1;border-radius:6px}
textarea{width:100%;height:110px;margin-top:10px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px}
.note{color:var(--mut);font-size:14px}
.bn{background:var(--card);border:1px solid var(--bd);border-left:6px solid #8a6bff;border-radius:16px;padding:10px 14px;margin-bottom:10px;font-weight:600}
</style></head><body><main id="app"></main>
<script>
const KEY='jee28-tracker-v1',PAL=['#5b8cff','#22c997','#b06cff','#ff9a4c','#ff5d8f','#f2c230'];
const FL=[['D','DPP'],['M','Module'],['P','PYQ']];
const SEED=[
[0,[['Introduction Class',1],['Thermal Expansion',7],['Unit and Dimensions',6],['Vector',6],['Calculus',8],['Kinematics',13],['NLM',8],['Circular Motion and WPE',11],['Centre of Mass, Momentum and Collision',10],['Rotational Dynamics',16],['SHM',7],['Fluid',4],['Elasticity',3],['Waves in a String',1]]],
[1,[['IUPAC',25],['Structural Isomerism',2],['GOC',11],['Mole Concept',18],['Atomic Structure',14],['Chemical Equilibrium',11],['Ionic Equilibrium',15],['Quantum Numbers',9],['Periodic Table and Periodic Properties',18],['Chemical Bonding',19]]],
[2,[['Modulus',1],['Basic Mathematics',7],['Logarithms',9],['Set',4],['Compound Angle (Trigonometry Phase-I)',11],['Quadratic Equations',10],['Sequence and Progression',9],['Trigonometric Equations (Trigonometry Phase-2)',4],['Permutation and Combination',8],['Binomial Theorem',6],['Determinants',4],['Solution of Triangle',2],['Straight Line',8],['Circle',2]]]];
const mk=n=>({n,lec:[],D:0,M:0,P:0});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mig(c){if(c.L){c.lec=Array.from({length:c.L[0]},(_,i)=>({n:'Lecture '+(i+1),d:1}));delete c.L}
FL.forEach(([k])=>{if(Array.isArray(c[k]))c[k]=c[k][0]>=c[k][1]?1:0;else c[k]=c[k]?1:0});c.lec=c.lec||[];return c}
function seedIt(){if(S.seed>=2)return;SEED.forEach(([si,list])=>{const sub=S.s[si];if(!sub)return;let pool=sub.ch.filter(c=>c.lec.length||c.D||c.M||c.P);
const out=list.map(([n,k])=>{const i=pool.findIndex(x=>x.n.toLowerCase()==n.toLowerCase());const c=i>=0?pool.splice(i,1)[0]:mk(n);if(!c.lec.length)c.lec=Array.from({length:k},(_,j)=>({n:'Lecture '+(j+1),d:0}));return c});
sub.ch=out.concat(pool)});S.seed=2;save()}
let S=load()||{s:[{n:'Physics',ch:[]},{n:'Chemistry',ch:[]},{n:'Maths',ch:[]}],log:{}};
S.s.forEach(s=>s.ch.forEach(mig));S.log=S.log||{};seedIt();
let tab=-1,E=false,flt='all',open=new Set(),fx=null,bk='',msg='',rm='',arm=null,fired=new Set();
const colr=i=>S.s[i].c||PAL[i%PAL.length];
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const cs=c=>[c.lec.filter(x=>x.d).length+c.D+c.M+c.P,c.lec.length+3];
const add2=(r,x)=>[r[0]+x[0],r[1]+x[1]];
const ss=s=>s.ch.reduce((r,c)=>add2(r,cs(c)),[0,0]);
const all=()=>S.s.reduce((r,s)=>add2(r,ss(s)),[0,0]);
const P=([a,b])=>b?Math.round(a/b*100):0;
const td=()=>S.log[ds(new Date())]||0;
function streak(){let n=0,d=new Date();if(!S.log[ds(d)])d.setDate(d.getDate()-1);while(S.log[ds(d)]>0){n++;d.setDate(d.getDate()-1)}return n}
function mark(v){const t=ds(new Date());S.log[t]=Math.max(0,(S.log[t]||0)+(v?1:-1))}
function theme(){const r=document.documentElement;if(S.theme)r.dataset.theme=S.theme;else delete r.dataset.theme}
const da=(a,s,c,x)=>`data-a="${a}" data-s="${s}" data-c="${c}"${x!=null?` data-x="${x}"`:''}`;
function tstats(chs){const l=chs.reduce((r,c)=>[r[0]+c.lec.filter(x=>x.d).length,r[1]+c.lec.length],[0,0]);return [['Lectures',l,'lectures']].concat(FL.map(([k,n])=>[n,[chs.filter(c=>c[k]).length,chs.length],'chapters']))}
function hero(){const p=P(all()),g=S.goal||5,t=td(),gp=Math.min(100,Math.round(t/g*100)),r=52,C=2*Math.PI*r;
return `<div class="hero"><button class="th" data-a="th" aria-label="Switch light or dark theme">◐</button><div class="hl"><div class="ring"><svg width="118" height="118" viewBox="0 0 118 118"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc2f5"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><circle cx="59" cy="59" r="${r}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="11"/><circle cx="59" cy="59" r="${r}" fill="none" stroke="url(#rg)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 59 59)"/></svg><b>${p}%</b></div><div><h1>JEE 2028</h1><p>Vibrant Academy Kota, online batch</p></div></div><div class="hr"><div class="chips"><span class="chip"><b>${streak()}</b> day streak</span><span class="chip"><b>${Math.max(0,Math.ceil((new Date(2028,0,22)-new Date())/864e5))}</b> days to Jan 2028</span></div><div class="goal">Today <b>${t}</b> of<input class="ld" type="number" min="1" value="${g}" data-i="goal" aria-label="Daily goal">items<div class="bar"><i style="width:${gp}%"></i></div></div></div></div>`}
function nav(){return `<nav>${S.s.map((s,i)=>`<button class="${tab==i?'on':''}" style="--ac:${colr(i)}" data-a="tab" data-s="${i}">${esc(s.n)} <small>${P(ss(s))}%</small></button>`).join('')}<button class="${tab<0?'on':''}" data-a="tab" data-s="-1">Overview</button><span class="sp"></span><button class="${E?'on':''}" data-a="edit">${E?'Done editing':'Edit'}</button></nav>`}
function chap(si,ci){const c=S.s[si].ch[ci],p=P(cs(c)),dn=c.lec.filter(x=>x.d).length,n=c.lec.length,nx=c.lec.findIndex(x=>!x.d),k=si+'-'+ci,o=E||open.has(k);
const cells=c.lec.map((x,i)=>`<button class="cl${x.d?' on':''}" ${da('tg',si,ci,i)} title="${esc(x.n)}" aria-label="${esc(x.n)}">${i+1}</button>`).join('');
const names=c.lec.map((x,i)=>`<div class="lr${x.d?' ok':''}">${E?`<input class="ln" value="${esc(x.n)}" data-i="ln" data-s="${si}" data-c="${ci}" data-l="${i}"><button class="del" ${da('dl',si,ci,i)} aria-label="Delete lecture">×</button>`:`<button class="lb" ${da('tg',si,ci,i)}><span class="bx">${x.d?'✓':''}</span><span class="t">${esc(x.n)}</span></button>`}</div>`).join('');
return `<div class="ch" style="--ac:${colr(si)}"><div class="hd">${E?`<input class="n" value="${esc(c.n)}" data-i="n" data-s="${si}" data-c="${ci}"><button class="mv" ${da('mv',si,ci,-1)} aria-label="Move up">↑</button><button class="mv" ${da('mv',si,ci,1)} aria-label="Move down">↓</button><button class="del" ${da('del',si,ci)}>${arm=='c'+k?'Delete?':'×'}</button>`:`<h3>${esc(c.n)}</h3><span class="pc">${p}%</span>`}</div><div class="bar"><i style="width:${p}%"></i></div>${n?`<div class="cells">${cells}</div><div class="ft"><span>Lectures<input class="ld" type="number" min="0" max="${n}" value="${dn}" data-i="ld" data-s="${si}" data-c="${ci}" aria-label="Lectures done">of ${n}</span>${nx>=0?`<button class="nx" ${da('nx',si,ci)}>✓ ${esc(c.lec[nx].n)}</button>`:'<span class="dn">All lectures done</span>'}</div>`:'<div class="ft">No lectures yet. Add some below.</div>'}<div class="fl">${FL.map(([f,l])=>`<button class="pill${c[f]?' on':''}" ${da('fl',si,ci,f)}>${c[f]?'✓ ':''}${l}</button>`).join('')}</div><div class="add"><input id="li-${si}-${ci}" data-en="al" data-s="${si}" data-c="${ci}" placeholder="Lecture name, or a number to add many"><button ${da('al',si,ci)}>Add</button></div>${n&&!E?`<button class="lk" ${da('op',si,ci)}>${o?'Hide':'Show'} lecture names</button>`:''}${o&&n?`<div class="lw">${names}</div>`:''}</div>`}
function subj(si){const s=S.s[si],ac=colr(si),p=P(ss(s));
const f={all:()=>1,active:q=>q>0&&q<100,todo:q=>q==0,done:q=>q==100}[flt];
const idx=s.ch.map((_,i)=>i).filter(i=>E||f(P(cs(s.ch[i]))));
return `<div class="panel sh" style="--ac:${ac}"><div class="shl">${E?`<input class="n big" value="${esc(s.n)}" data-i="sn" data-s="${si}"><button class="del" data-a="ds" data-s="${si}">${arm=='s'+si?'Delete subject?':'Delete subject'}</button>`:`<h2>${esc(s.n)}</h2><b class="pc big">${p}%</b>`}</div><div class="bar"><i style="width:${p}%"></i></div><div class="chips">${tstats(s.ch).map(([l,r])=>`<span class="chip2">${l} <b>${r[0]}/${r[1]}</b></span>`).join('')}</div><div class="fcs">${[['all','All'],['active','In progress'],['todo','Not started'],['done','Completed']].map(([k,l])=>`<button class="fc${flt==k?' on':''}" style="--ac:${ac}" data-a="flt" data-x="${k}">${l}</button>`).join('')}</div></div><div class="grid">${idx.map(i=>chap(si,i)).join('')||'<div class="note">Nothing here yet. Add a chapter below.</div>'}</div><div class="add"><input id="nc" data-en="add" placeholder="New chapter name in ${esc(s.n)}"><button data-a="add">Add chapter</button></div>`}
function bars(rows,ac){return rows.map(([l,r,u])=>`<div class="row" style="--ac:${ac}"><span>${l}</span><div class="bar"><i style="width:${P(r)}%"></i></div><b>${P(r)}%</b></div>${u?`<div class="sub">${r[0]} of ${r[1]} ${u}</div>`:''}`).join('')}
function overview(){
let h=`<div class="panel"><h2>Up next</h2>`;
S.s.forEach((s,si)=>{const ci=s.ch.findIndex(c=>c.lec.some(x=>!x.d));if(ci<0){h+=`<div class="nxr"><div><b style="color:${colr(si)}">${esc(s.n)}</b><small>All lectures done</small></div></div>`;return}
const c=s.ch[ci],l=c.lec.find(x=>!x.d);h+=`<div class="nxr" style="--ac:${colr(si)}"><div><b>${esc(s.n)}</b>, ${esc(c.n)}<small>${esc(l.n)}</small></div><button class="nx" ${da('nx',si,ci)} aria-label="Mark done">✓ Done</button></div>`});
h+=`</div><div class="panel"><h2>Subjects</h2>${S.s.map((s,i)=>{const p=P(ss(s));return `<div class="row" style="--ac:${colr(i)}"><span>${esc(s.n)}</span><div class="bar"><i style="width:${p}%"></i></div><b>${p}%</b></div>`}).join('')}</div>`;
h+=`<div class="panel"><h2>By type</h2>${bars(tstats(S.s.flatMap(s=>s.ch)),'#7c5cff')}</div>`;
const days=[...Array(28)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-27+i);return[ds(d),S.log[ds(d)]||0]}),v=Object.values(S.log);
h+=`<div class="panel"><h2>Momentum</h2><div class="stats"><div class="stat"><b>${days.slice(21).reduce((a,x)=>a+x[1],0)}</b><span>marked this week</span></div><div class="stat"><b>${Math.max(0,...v)}</b><span>best day</span></div><div class="stat"><b>${v.reduce((a,b)=>a+b,0)}</b><span>marked in total</span></div></div><div class="hm">${days.map(([d,n])=>`<div title="${d}: ${n}" style="background:${n?`rgba(124,92,255,${Math.min(1,.2+n/12)})`:'var(--hm)'}"></div>`).join('')}</div><p class="note">Last 28 days. Darker means more items marked that day.</p></div>`;
h+=`<div class="panel"><h2>Add a subject</h2><div class="add" style="margin:0"><input id="ns" data-en="ns" placeholder="Subject name"><button data-a="ns">Add subject</button></div></div>`;
h+=`<div class="panel"><h2>Reminders</h2><p class="note" style="margin-top:0">Start studying at 3:45 pm, mark completions at 11 pm, weekly curated test on Sunday morning. Calendar reminders work even when this page is closed. Alerts here only fire while the app is open.</p><div class="add" style="margin:0"><button data-a="nt">${S.nt?'Turn off alerts':'Turn on alerts'}</button></div>${rm?`<p class="note">${rm}</p>`:''}</div>`;
h+=`<div class="panel"><h2>Backup</h2><p class="note" style="margin-top:0">Your progress lives in this browser. Copy a backup now and then, and paste it back here to restore on another device.</p><div class="add" style="margin:0"><button data-a="bk">${bk?'Hide backup':'Show backup'}</button>${bk?'<button data-a="rs">Restore from text</button>':''}</div>${bk?`<textarea id="bt" aria-label="Backup text">${esc(bk)}</textarea>`:''}${msg?`<p class="note">${msg}</p>`:''}</div>`;
return h}
function render(){theme();document.getElementById('app').innerHTML=hero()+banners()+nav()+(tab<0||!S.s[tab]?overview():subj(tab));
if(fx){const e=document.getElementById(fx);if(e)e.focus();fx=null}}
function act(b){const a=b.dataset.a,s=+b.dataset.s,c=+b.dataset.c,x=b.dataset.x,was=arm;arm=null;msg='';rm='';
const ch=()=>S.s[s].ch[c];
if(a=='tab'){tab=s}else if(a=='edit')E=!E;
else if(a=='th'){const dk=S.theme?S.theme=='dark':matchMedia('(prefers-color-scheme: dark)').matches;S.theme=dk?'light':'dark'}
else if(a=='flt')flt=x;
else if(a=='op'){const k=s+'-'+c;open.has(k)?open.delete(k):open.add(k)}
else if(a=='tg'){const l=ch().lec[+x];l.d=l.d?0:1;mark(l.d)}
else if(a=='nx'){const l=ch().lec.find(q=>!q.d);if(l){l.d=1;mark(1)}}
else if(a=='fl'){ch()[x]=ch()[x]?0:1;mark(ch()[x])}
else if(a=='dl'){const l=ch().lec[+x];if(l.d)mark(0);ch().lec.splice(+x,1)}
else if(a=='mv'){const A=S.s[s].ch,j=c+ +x;if(j>=0&&j<A.length)[A[c],A[j]]=[A[j],A[c]]}
else if(a=='del'){const k='c'+s+'-'+c;if(was==k){ch().lec.filter(q=>q.d).forEach(()=>mark(0));S.s[s].ch.splice(c,1)}else arm=k}
else if(a=='ds'){if(was=='s'+s){S.s.splice(s,1);tab=-1}else arm='s'+s}
else if(a=='al'){const i=document.getElementById(`li-${s}-${c}`),v=i.value.trim(),L=ch().lec;
if(/^\d+$/.test(v)){for(let j=0,n=Math.min(+v,100);j<n;j++)L.push({n:'Lecture '+(L.length+1),d:0})}else L.push({n:v||'Lecture '+(L.length+1),d:0});fx=i.id}
else if(a=='add'){const i=document.getElementById('nc'),v=i.value.trim();if(v){S.s[tab].ch.push(mk(v));fx='nc'}}
else if(a=='ns'){const v=document.getElementById('ns').value.trim();if(v){S.s.push({n:v,ch:[]});tab=S.s.length-1}}
else if(a=='nt'){if(S.nt)S.nt=0;else{try{Notification.requestPermission().then(p=>{S.nt=p=='granted'?1:0;rm=S.nt?'':'Alerts were blocked here. Use the calendar reminders instead.';save();render()})}catch(e){rm='Alerts are not supported here. Use the calendar reminders instead.'}}}
else if(a=='bk')bk=bk?'':JSON.stringify(S);
else if(a=='rs'){try{const o=JSON.parse(document.getElementById('bt').value);if(!Array.isArray(o.s))throw 0;o.s.forEach(q=>q.ch.forEach(mig));o.log=o.log||{};S=o;bk='';msg='Backup restored.'}catch(e){msg='That text is not a valid backup.'}}
save();render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b)});
document.addEventListener('keydown',e=>{if(e.key!='Enter'||!e.target.dataset.en)return;const d=e.target.dataset;act({dataset:{a:d.en,s:d.s||tab,c:d.c||0}})});
document.addEventListener('change',e=>{const d=e.target.dataset,i=d.i;if(!i)return;const v=e.target.value.trim();
if(i=='goal')S.goal=Math.max(1,Math.floor(+v)||5);
else if(i=='sn')S.s[+d.s].n=v||S.s[+d.s].n;
else{const ch=S.s[+d.s].ch[+d.c];
if(i=='ld'){const k=Math.max(0,Math.min(ch.lec.length,Math.floor(+v)||0)),cur=ch.lec.filter(x=>x.d).length;ch.lec.forEach((x,j)=>x.d=j<k?1:0);for(let j=0;j<Math.abs(k-cur);j++)mark(k>cur)}
else if(i=='n')ch.n=v||ch.n;else if(i=='ln')ch.lec[+d.l].n=v||ch.lec[+d.l].n}
save();render()});
function due(){const n=new Date(),m=n.getHours()*60+n.getMinutes(),r=[];
if(n.getDay()==0&&m<720)r.push('Sunday morning: take your weekly curated test.');
if(m>=1380)r.push('Mark today’s completions before you sleep.');
else if(m>=945&&!td())r.push('Time to start studying. Nothing is marked yet today.');
return r}
function banners(){return due().map(t=>`<div class="bn">${t}</div>`).join('')}
function ntf(x){const o={body:x,icon:'icon-192.png',tag:x};try{navigator.serviceWorker.ready.then(r=>r.showNotification('JEE 2028 Tracker',o))}catch(e){try{new Notification('JEE 2028 Tracker',o)}catch(_){}}}
setInterval(()=>{if(!S.nt)return;const n=new Date(),m=n.getHours()*60+n.getMinutes(),d=ds(n);
[[945,'Time to start studying'],[1380,'Mark today’s completions']].concat(n.getDay()==0?[[480,'Weekly curated test today']]:[]).forEach(([t,x])=>{const k=d+t;if(m==t&&!fired.has(k)){fired.add(k);ntf(x)}})},20000);
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
